    <style>
        /* CSS Flexbox Layout (Task A) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .search-container {
            margin-bottom: 30px;
            text-align: center;
        }

        #product-search {
            padding: 12px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Responsive Flexbox Container */
        .product-grid {
            display: flex;
            flex-wrap: wrap; 
            gap: 20px;       
            justify-content: center;
        }

        /* Product Card Styling */
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 200px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }

        .product-card p {
            font-weight: bold;
            color: #e67e22;
        }

        /* Utility class to hide filtered items */
        .hidden {
            display: none;
        }

        /* Style for the "Not Found" message */
        #no-results {
            display: none; /* Hidden by default */
            text-align: center;
            font-size: 20px;
            color: #777;
            margin-top: 50px;
            font-weight: bold;
        }
    </style>
</head>

<script>
    const searchInput = document.getElementById('product-search');
    const productCards = document.querySelectorAll('.product-card');
    const noResults = document.getElementById('no-results');

    searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        let matchFound = false; // Flag to track if at least one product is visible

        productCards.forEach(card => {
            const title = card.querySelector('h3').textContent.toLowerCase();
            
            if (title.includes(searchTerm)) {
                card.classList.remove('hidden');
                matchFound = true; // Set to true if a match is found
            } else {
                card.classList.add('hidden');
            }
        });

        // Toggle the "Product not found" message visibility
        if (matchFound) {
            noResults.style.display = 'none';
        } else {
            noResults.style.display = 'block';
        }
    });
</script>
